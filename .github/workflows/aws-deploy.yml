name: Build, Push to ECR and Deploy to ECS

on:
  push:
    branches: [ "main" ]

env:
  # Se recomienda manejar estos valores como variables o secretos en GitHub
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }} # Ingresa tu ID: 915290282773 en los secretos de GitHub

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set Image Tag
        run: echo "IMAGE_TAG=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Build Java Applications (Maven)
        # Compila todos los microservicios en paralelo en el monorepo
        run: ./mvnw -q -T 1C -DskipTests clean package

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/CoboxGithubOidcRole
          role-session-name: gha-ecr-push

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Images
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ECR="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          TAG="$IMAGE_TAG"

          # Array con los nombres exactos de las carpetas de tu monorepo
          declare -a svc=("config-service" "eureka-service" "iam-service" "fleet-service" "delivery-service" "support-service" "incident-service" "maintenance-service" "edge-service" "mobile-bff-service" "desktop-bff-service" "ai-validation-service" "report-service" "gateway-service")

          for s in "${svc[@]}"; do
            echo "Construyendo y subiendo imagen para: $s"

            # Construye usando el Dockerfile dentro de la carpeta de cada microservicio
            docker build -t $s:latest ./$s

            # Etiqueta con el tag temporal y el latest
            docker tag $s:latest $ECR/$s:$TAG
            docker tag $s:latest $ECR/$s:latest

            # Sube ambas etiquetas al repositorio ECR correspondiente
            docker push $ECR/$s:$TAG
            docker push $ECR/$s:latest
          done

  deploy:
    name: Deploy to AWS ECS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/CoboxGithubOidcRole
          role-session-name: gha-ecs-deploy

      - name: Update ECS Services (dev)
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          ECS_CLUSTER="cobox-dev"

          declare -a svc=("config-service" "eureka-service" "iam-service" "fleet-service" "delivery-service" "support-service" "incident-service" "maintenance-service" "edge-service" "mobile-bff-service" "desktop-bff-service" "ai-validation-service" "report-service" "gateway-service")

          for s in "${svc[@]}"; do
            echo "=== Forzando nuevo despliegue de: $s ==="
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "cobox-dev-${s}" \
              --force-new-deployment \
              --region "$AWS_REGION" \
              >/dev/null
          done

          echo "=== Esperando a que los servicios queden estables ==="
          for s in "${svc[@]}"; do
            echo "--- Esperando estabilidad de: $s ---"
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "cobox-dev-${s}" \
              --region "$AWS_REGION"
          done

          echo "[OK] Deploy done: 14 servicios actualizados y estables en $ECS_CLUSTER"
