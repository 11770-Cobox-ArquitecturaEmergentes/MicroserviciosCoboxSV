services:
  # 1. SERVICIO DE BASE DE DATOS POSTGRESQL (Para Entorno Local)
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: postgres_db
      POSTGRES_USER: admin_postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_postgres -d postgres_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. CONFIG SERVICE
  config-service:
    build: ./config-service
    container_name: config-service
    environment:
      - SPRING_PROFILES_ACTIVE=native
    ports: [ "8888:8888" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 3. EUREKA SERVICE
  eureka-service:
    build: ./eureka-service
    container_name: eureka-service
    depends_on:
      config-service:
        condition: service_healthy
    ports: [ "8761:8761" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 4. IAM SERVICE
  iam-service:
    build: ./iam-service
    container_name: iam-service
    depends_on:
      eureka-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=postgres_db
      - POSTGRES_USER=admin_postgres
      - POSTGRES_PASSWORD=secret
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 5. FLEET SERVICE
  fleet-service:
    build: ./fleet-service
    container_name: fleet-service
    depends_on:
      iam-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=postgres_db
      - POSTGRES_USER=admin_postgres
      - POSTGRES_PASSWORD=secret
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 6. DELIVERY SERVICE
  delivery-service:
    build: ./delivery-service
    container_name: delivery-service
    depends_on:
      iam-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=postgres_db
      - POSTGRES_USER=admin_postgres
      - POSTGRES_PASSWORD=secret
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 7. SUPPORT SERVICE
  support-service:
    build: ./support-service
    container_name: support-service
    depends_on:
      iam-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=postgres_db
      - POSTGRES_USER=admin_postgres
      - POSTGRES_PASSWORD=secret
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 8. EDGE SERVICE
  edge-service:
    build: ./edge-service
    container_name: edge-service
    depends_on:
      iam-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8087
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=postgres_db
      - POSTGRES_USER=admin_postgres
      - POSTGRES_PASSWORD=secret
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/postgres_db
      - SPRING_DATASOURCE_USERNAME=admin_postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8087/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 9. INCIDENT SERVICE
  incident-service:
    build: ./incident-service
    container_name: incident-service
    depends_on:
      iam-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8085
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=postgres_db
      - POSTGRES_USER=admin_postgres
      - POSTGRES_PASSWORD=secret
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/postgres_db
      - SPRING_DATASOURCE_USERNAME=admin_postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 10. MAINTENANCE SERVICE
  maintenance-service:
    build: ./maintenance-service
    container_name: maintenance-service
    depends_on:
      iam-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8086
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=postgres_db
      - POSTGRES_USER=admin_postgres
      - POSTGRES_PASSWORD=secret
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/postgres_db
      - SPRING_DATASOURCE_USERNAME=admin_postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 11. GATEWAY SERVICE (Escalable)
  gateway-service:
    build: ./gateway-service
    depends_on:
      eureka-service:
        condition: service_healthy
      iam-service:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      edge-service:
        condition: service_healthy
      support-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      maintenance-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 12. NGINX REVERSE PROXY / LOAD BALANCER
  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      gateway-service:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  # 13. CERTBOT
  certbot:
    image: certbot/certbot
    profiles: [ "ssl" ]
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email davidalexd1234@gmail.com --agree-tos --no-eff-email --staging -d cobox.duckdns.org

  # 14. PROMETHEUS
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway-service
    networks:
      - default

  # 15. GRAFANA
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - default

networks:
  default:
    name: microservices_network

volumes:
  data:
