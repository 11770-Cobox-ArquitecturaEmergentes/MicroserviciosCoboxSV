x-java-common: &java-common
  SPRING_CLOUD_CONFIG_RETRY_ENABLED: "true"
  SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS: "40"
  SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: "1000"
  SPRING_CLOUD_CONFIG_RETRY_MULTIPLIER: "1.5"

  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "2"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "60000"
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "300000"

x-health-default: &health-default
  interval: 15s
  timeout: 10s
  retries: 30
  start_period: 120s

services:
  config-service:
    image: "${ECR}/config-service:${TAG:-latest}"
    container_name: config-service
    environment:
      SPRING_PROFILES_ACTIVE: native
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  eureka-service:
    image: "${ECR}/eureka-service:${TAG:-latest}"
    container_name: eureka-service
    depends_on:
      config-service:
        condition: service_healthy
    environment:
      <<: *java-common
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    ports:
      - "127.0.0.1:8761:8761"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    env_file:
      - /opt/cobox/env/rabbitmq.env
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  iam-service:
    image: "${ECR}/iam-service:${TAG:-latest}"
    depends_on:
      eureka-service:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/iam.env
    environment:
      <<: *java-common
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      <<: *health-default
    restart: unless-stopped

  fleet-service:
    image: "${ECR}/fleet-service:${TAG:-latest}"
    depends_on:
      iam-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/rabbitmq.env
      - /opt/cobox/env/fleet.env
    environment:
      <<: *java-common
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 448m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      <<: *health-default
    restart: unless-stopped

  delivery-service:
    image: "${ECR}/delivery-service:${TAG:-latest}"
    depends_on:
      iam-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/rabbitmq.env
      - /opt/cobox/env/delivery.env
    environment:
      <<: *java-common
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 448m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      <<: *health-default
    restart: unless-stopped

  support-service:
    image: "${ECR}/support-service:${TAG:-latest}"
    depends_on:
      iam-service:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/support.env
    environment:
      <<: *java-common
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 448m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      <<: *health-default
    restart: unless-stopped

  incident-service:
    image: "${ECR}/incident-service:${TAG:-latest}"
    depends_on:
      iam-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/rabbitmq.env
      - /opt/cobox/env/incident.env
    environment:
      <<: *java-common
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 448m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      <<: *health-default
    restart: unless-stopped

  maintenance-service:
    image: "${ECR}/maintenance-service:${TAG:-latest}"
    depends_on:
      iam-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/rabbitmq.env
      - /opt/cobox/env/maintenance.env
    environment:
      <<: *java-common
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 448m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]
      <<: *health-default
    restart: unless-stopped

  edge-service:
    image: "${ECR}/edge-service:${TAG:-latest}"
    depends_on:
      iam-service:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/edge.env
    environment:
      <<: *java-common
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 448m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8087/actuator/health | grep -q '\"status\":\"UP\"'"]
      <<: *health-default
    restart: unless-stopped

  mobile-bff-service:
    image: "${ECR}/mobile-bff-service:${TAG:-latest}"
    depends_on:
      iam-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/rabbitmq.env
      - /opt/cobox/env/mobile-bff.env
    environment:
      <<: *java-common
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health | grep -q '\"status\":\"UP\"'"]
      <<: *health-default
    restart: unless-stopped

  desktop-bff-service:
    image: "${ECR}/desktop-bff-service:${TAG:-latest}"
    depends_on:
      iam-service:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      maintenance-service:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/desktop-bff.env
    environment:
      <<: *java-common
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8089/actuator/health | grep -q '\"status\":\"UP\"'"]
      <<: *health-default
    restart: unless-stopped

  ai-validation-service:
    image: "${ECR}/ai-validation-service:${TAG:-latest}"
    depends_on:
      iam-service:
        condition: service_healthy
      edge-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/rabbitmq.env
      - /opt/cobox/env/ai-validation.env
    environment:
      <<: *java-common
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped

  report-service:
    image: "${ECR}/report-service:${TAG:-latest}"
    depends_on:
      iam-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - /opt/cobox/env/rabbitmq.env
      - /opt/cobox/env/report.env
    environment:
      <<: *java-common
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 448m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/actuator/health | grep -q '\"status\":\"UP\"'"]
      <<: *health-default
    restart: unless-stopped

  gateway-service:
    image: "${ECR}/gateway-service:${TAG:-latest}"
    depends_on:
      eureka-service:
        condition: service_healthy
      iam-service:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      support-service:
        condition: service_healthy
      edge-service:
        condition: service_healthy
      mobile-bff-service:
        condition: service_healthy
      desktop-bff-service:
        condition: service_healthy
      ai-validation-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      maintenance-service:
        condition: service_healthy
    environment:
      <<: *java-common
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      gateway-service:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/cobox/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/cobox/data/certbot/conf:/etc/nginx/ssl:ro
      - /opt/cobox/data/certbot/www:/var/www/certbot:ro
    mem_limit: 128m
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    profiles: [ "ssl" ]
    volumes:
      - /opt/cobox/data/certbot/conf:/etc/letsencrypt
      - /opt/cobox/data/certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email jhonfcbm.1900@gmail.com --agree-tos --no-eff-email -d coboxsv.duckdns.org

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - /opt/cobox/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      gateway-service:
        condition: service_started
    mem_limit: 256m
    networks:
      - default
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - /opt/cobox/env/grafana.env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    mem_limit: 384m
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: cobox_aws_network

volumes:
  rabbitmq_data:
