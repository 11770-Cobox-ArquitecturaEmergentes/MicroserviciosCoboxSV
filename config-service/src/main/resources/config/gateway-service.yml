server:
  port: 8080  # Puerto del API Gateway

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://iam-service:8081/api/v1/jwks/.well-known/jwks.json"

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "https://localhost:*"
              - "http://127.0.0.1:*"
              - "https://127.0.0.1:*"
              - "https://coboxsv.duckdns.org"
              - "https://frontend-cobox-sv.vercel.app"
              - "https://*.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
              - HEAD
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
              - Content-Type
              - X-RateLimit-Limit
              - X-RateLimit-Remaining
              - X-RateLimit-Reset
            allowCredentials: true
            maxAge: 3600
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: iam-service-docs
          uri: lb://iam-service
          predicates:
            - Path=/iam-service/v3/api-docs/**
          filters:
            - StripPrefix=1
            - PreserveHostHeader

        - id: iam-service-route
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/authentication/**,/api/v1/roles/**,/api/v1/users/**,/api/v1/jwks/**
          filters:
            - PreserveHostHeader

        - id: fleet-service-docs
          uri: lb://fleet-service
          predicates:
            - Path=/fleet-service/v3/api-docs/**
          filters:
            - StripPrefix=1
            - PreserveHostHeader

        - id: fleet-service-route
          uri: lb://fleet-service
          predicates:
            - Path=/api/v1/drivers/**,/api/v1/routes/**,/api/v1/vehicles/**
          filters:
            - PreserveHostHeader

        - id: delivery-service-docs
          uri: lb://delivery-service
          predicates:
            - Path=/delivery-service/v3/api-docs/**
          filters:
            - StripPrefix=1
            - PreserveHostHeader

        - id: delivery-service-route
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/client/**,/api/v1/orders/**
          filters:
            - PreserveHostHeader

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: iam-service
        url: /iam-service/v3/api-docs
      - name: delivery-service
        url: /delivery-service/v3/api-docs
      - name: fleet-service
        url: /fleet-service/v3/api-docs

# ==========================================
# Rate Limiting Configuration
# ==========================================
gateway:
  rate-limit:
    enabled: true
    include-headers: true

    global:
      max-requests: 100
      window-seconds: 10

    endpoints:
      # Authentication Endpoints
      "[/api/v1/authentication/**]":
        max-requests: 20
        window-seconds: 60

      # Actuator and Swagger
      "[/actuator/**]":
        max-requests: 200
        window-seconds: 10

      "[/swagger-ui/**]":
        max-requests: 200
        window-seconds: 10

      # Order Endpoints
      "[/api/v1/orders/**]":
        max-requests: 50
        window-seconds: 10

      # Client Endpoints
      "[/api/v1/client/**]":
        max-requests: 50
        window-seconds: 10

