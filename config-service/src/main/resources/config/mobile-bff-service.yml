server:
  port: 8088
  forward-headers-strategy: framework

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${AUTH0_ISSUER_URI:https://dev-e5ik5gbwpzkcqfrw.us.auth0.com/}"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.upc.mobilebffservice.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
    show-sql: true
  rabbitmq:
    host: "${RABBITMQ_HOST:rabbitmq}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USERNAME:guest}"
    password: "${RABBITMQ_PASSWORD:guest}"

auth0:
  audience: "${AUTH0_AUDIENCE:https://api.coboxsv.dev}"

storage:
  s3:
    bucket: "${S3_EVIDENCE_BUCKET:coboxsv-evidence-prod}"
    region: "${AWS_REGION:us-east-2}"
    presigned-url-expiration-minutes: "${S3_PRESIGNED_URL_EXPIRATION_MINUTES:15}"

cobox:
  rabbitmq:
    exchange: "cobox.events"
    evidence-upload-confirmed-routing-key: "evidence.upload.confirmed"
    evidence-upload-confirmed-queue: "ai.evidence-upload-confirmed"
    evidence-upload-confirmed-dlq: "ai.evidence-upload-confirmed.dlq"
    relay-max-retries: "${OUTBOX_RELAY_MAX_RETRIES:5}"
    relay-interval-ms: "${OUTBOX_RELAY_INTERVAL_MS:5000}"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
