spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:ai_validation_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://issuer.example/

auth0:
  audience: https://api.coboxsv.dev

storage:
  s3:
    bucket: cobox-evidence-test
    region: us-east-1

cobox:
  ai:
    provider: test
  rabbitmq:
    exchange: cobox.events
    evidence-upload-confirmed-routing-key: evidence.upload.confirmed
    evidence-upload-confirmed-queue: ai.evidence-upload-confirmed
    evidence-upload-confirmed-dlq: ai.evidence-upload-confirmed.dlq
